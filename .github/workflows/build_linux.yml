name: Build - Linux

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build_linux.yml'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    env:
      PROJECT_NAME: ${{ github.event.repository.name }}
      RELEASE_PATH: ${{ github.event.repository.name }}_dev_linux_x64

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup release path
        if: github.event_name == 'release'
        run: echo "RELEASE_PATH=${{ env.PROJECT_NAME }}_v${{ github.event.release.tag_name }}_linux_x64" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libglfw3-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxi-dev libxext-dev libxfixes-dev \
            libwayland-dev libxkbcommon-dev \
            cmake ninja-build

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: |
          mkdir -p ${{ env.RELEASE_PATH }}
          cp build/bin/game ${{ env.RELEASE_PATH }}/
          cp -r resources ${{ env.RELEASE_PATH }}/
          cp README.md LICENSE ${{ env.RELEASE_PATH }}/ 2>/dev/null || true
          7z a ${{ env.RELEASE_PATH }}.zip ${{ env.RELEASE_PATH }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_PATH }}
          path: ${{ env.RELEASE_PATH }}/

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.RELEASE_PATH }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
